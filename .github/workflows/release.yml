name: release

on:
  workflow_dispatch:

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    outputs:
      is_beta: ${{ steps.ver.outputs.is_beta }}
      major_minor_patch_version_tag: ${{ steps.ver.outputs.major_minor_patch_version_tag }}
    environment:
      name: release
      url: https://www.npmjs.com/package/@icp-sdk/auth
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Python
        uses: dfinity/ci-tools/actions/setup-python@a98f5d0198719ad41ded2f02fa0f5e426102f369 # main

      - name: Setup Commitizen
        uses: dfinity/ci-tools/actions/setup-commitizen@a98f5d0198719ad41ded2f02fa0f5e426102f369 # main

      - name: Setup PNPM
        uses: dfinity/ci-tools/actions/setup-pnpm@a98f5d0198719ad41ded2f02fa0f5e426102f369 # main

      - uses: dfinity/ci-tools/actions/extract-version@a98f5d0198719ad41ded2f02fa0f5e426102f369 # main
        id: extract-version
        with:
          file: package.json

      - name: Prepare version
        id: ver
        run: |
          echo "major_minor_version=v${{ steps.extract-version.outputs.major }}.${{ steps.extract-version.outputs.minor }}" >> $GITHUB_OUTPUT
          echo "major_minor_patch_version=v${{ steps.extract-version.outputs.major }}.${{ steps.extract-version.outputs.minor }}.${{ steps.extract-version.outputs.patch }}" >> $GITHUB_OUTPUT
          echo "major_minor_patch_version_tag=${{ steps.extract-version.outputs.major }}.${{ steps.extract-version.outputs.minor }}.${{ steps.extract-version.outputs.patch }}" >> $GITHUB_OUTPUT
          echo "version=${{ steps.extract-version.outputs.major }}.${{ steps.extract-version.outputs.minor }}.${{ steps.extract-version.outputs.patch }}${{ steps.extract-version.outputs.prerelease }}" >> $GITHUB_OUTPUT
          echo "is_beta=${{ steps.extract-version.outputs.prerelease != '' }}" >> $GITHUB_OUTPUT

      - name: Check the version is not released yet
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Build NPM package
        run: pnpm build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          pnpm pack

          release_cmd="pnpm publish --verbose --access public --no-git-checks"
          if [ "${{ steps.ver.outputs.is_beta }}" = 'true' ]; then
            release_cmd="$release_cmd --tag beta"
          fi
          $release_cmd

      - name: Tag the release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      - name: Generate release notes
        uses: dfinity/ci-tools/actions/generate-release-notes@a98f5d0198719ad41ded2f02fa0f5e426102f369 # main
        with:
          version: ${{ steps.ver.outputs.version }}

      - name: Create Github release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          artifacts: 'icp-sdk-auth-${{ steps.ver.outputs.version }}.tgz'
          bodyFile: 'RELEASE_NOTES.md'
          tag: '${{ steps.ver.outputs.version }}'
          commit: '${{ github.sha }}'
          prerelease: ${{ steps.ver.outputs.is_beta == 'true' }}
          makeLatest: ${{ steps.ver.outputs.is_beta == 'false' }}

  publish-docs:
    needs: release
    if: ${{ needs.release.outputs.is_beta == 'false' }}
    uses: ./.github/workflows/publish-docs.yml
    with:
      ref: ${{ needs.release.outputs.major_minor_patch_version_tag }}
    secrets: inherit
